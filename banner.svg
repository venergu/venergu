<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#171028"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .sans { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      .float1 { animation: float 7s ease-in-out infinite; }
      .float2 { animation: float 9s ease-in-out infinite reverse; }
      @keyframes blink { to { visibility: hidden; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <g class="float1">
    <rect x="880" y="60" width="150" height="150" rx="22" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.7" transform="rotate(14 955 135)"/>
  </g>
  <g class="float2">
    <rect x="950" y="120" width="110" height="110" rx="18" fill="url(#accent)" opacity="0.18" transform="rotate(-10 1005 175)"/>
    <circle cx="1090" cy="80" r="9" fill="#8B5CF6"/>
    <circle cx="840" cy="240" r="6" fill="#3B82F6"/>
  </g>

  <text x="70" y="96" class="mono" font-size="18" fill="#8B5CF6">&lt;developer&gt;</text>
  <text x="70" y="178" class="sans" font-size="82" font-weight="800" fill="#ffffff">venergu</text>
  <rect x="72" y="198" width="210" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="248" class="mono" font-size="22" fill="#c9d1d9">web apps / websites / FiveM</text>
  <text x="70" y="284" class="mono" font-size="16" fill="#8b949e">React  Next.js  Node  Lua</text>
  <rect class="cursor" x="402" y="268" width="10" height="20" fill="#A78BFA"/>
</svg>
